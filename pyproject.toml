[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financeagent"
version = "0.1.0"
description = "Stock research, backtest, paper trading, and Order Gate"
readme = "README.md"
requires-python = ">=3.11"
# 核心依赖仍以 requirements.txt 为准。这里只声明可选券商 SDK。
dependencies = []

[project.optional-dependencies]
futu = ["futu-api"]
longbridge = ["longbridge"]

[tool.setuptools.packages.find]
include = ["position_agent*", "quant*"]
