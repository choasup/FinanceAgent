# FinanceAgent 反向代理 (Nginx)
# 放到 /etc/nginx/sites-available/financeagent, 然后:
#   ln -s /etc/nginx/sites-available/financeagent /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Streamlit 依赖 WebSocket, 下面的 Upgrade 头是必须的。

server {
    listen 80;
    server_name your-domain.com;   # ← 改成你的域名或公网 IP

    # 可选: 简单口令保护 (见 DEPLOY.md 生成 .htpasswd)
    # auth_basic "FinanceAgent";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (Streamlit 实时通信必需)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
