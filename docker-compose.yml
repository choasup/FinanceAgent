services:
  api:
    build:
      context: .
      args:
        # 国内服务器用腾讯云 PyPI 镜像加速; 海外构建可删掉此行用默认官方源
        PIP_INDEX_URL: https://mirrors.cloud.tencent.com/pypi/simple
    image: financeagent-api:latest
    container_name: financeagent-api
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      # 持久化行情缓存与报告产物
      - ./data:/app/data
      - ./reports:/app/reports
    environment:
      - QUANT_DATA_DIR=/app/data

  web:
    build:
      context: ./web
      args:
        # 国内服务器用 npmmirror 加速; 海外构建可删掉此行用默认官方源
        NPM_REGISTRY: https://registry.npmmirror.com
    image: financeagent-web:latest
    container_name: financeagent-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - API_URL=http://api:8000
    ports:
      - "8501:3000"
